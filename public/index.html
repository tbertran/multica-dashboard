<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c2c47" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Multica" />
<title>Multica Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
<script>try{var t=localStorage.getItem('multica-dashboard:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="app-header">
    <a class="brand" href="/" aria-label="Multica dashboard">
      <svg class="multica-mark" viewBox="0 0 100 100" aria-hidden="true"><polygon fill="currentColor" points="45,62.1 45,100 55,100 55,62.1 81.8,88.9 88.9,81.8 62.1,55 100,55 100,45 62.1,45 88.9,18.2 81.8,11.1 55,37.9 55,0 45,0 45,37.9 18.2,11.1 11.1,18.2 37.9,45 0,45 0,55 37.9,55 11.1,81.8 18.2,88.9"/></svg>
      <span class="brand-name">multica</span>
    </a>
    <div class="header-actions">
      <span id="conn" class="conn" data-state="connecting" role="status">
        <i class="conn-dot"></i><span class="conn-text">Connecting</span>
      </span>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch light / dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" id="menu-toggle" class="icon-btn" aria-label="More" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
    <div id="menu" hidden>
      <button type="button" id="restart-server" class="menu-item">Restart server</button>
    </div>
  </header>

  <main>
    <section id="list-panel" aria-label="Running tasks">
      <div id="stats">
        <div class="stat stat-live">
          <span class="stat-num" id="stat-working">–</span>
          <span class="stat-label">Running<span class="lbl-long"> tasks</span></span>
        </div>
        <div class="stat">
          <span class="stat-num" id="stat-agents">–</span>
          <span class="stat-label"><span class="lbl-long">Active </span>agents</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="stat-open">–</span>
          <span class="stat-label">Open<span class="lbl-long"> issues</span></span>
        </div>
      </div>
      <div id="controls">
        <label class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="issue-filter" placeholder="Filter tasks" autocomplete="off" enterkeyhint="search" />
        </label>
        <div class="segmented" role="group" aria-label="Whose tasks">
          <button type="button" id="seg-all" aria-pressed="true">All</button>
          <button type="button" id="seg-mine" aria-pressed="false">Mine</button>
        </div>
      </div>
      <div id="agent-bar">
        <button type="button" id="agent-bar-show-all" hidden>Show all</button>
        <div id="agent-chips"></div>
      </div>
      <div id="issue-tree" role="list">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>

    <div id="divider" role="separator" aria-orientation="vertical"></div>

    <section id="transcript" class="no-selection" aria-label="Task log">
      <div id="transcript-header" role="button" tabindex="0" aria-expanded="false">
        <span class="sheet-grip" aria-hidden="true"></span>
        <div class="th-main">
          <div id="transcript-title">Task log</div>
          <div id="transcript-sub">Tap a running task to watch it work</div>
        </div>
        <label class="switch" id="autoscroll-switch">
          <input type="checkbox" id="auto-scroll" checked />
          <span class="track"></span>
          <span>Auto-scroll</span>
        </label>
        <button type="button" id="sheet-toggle" class="icon-btn sheet-toggle" aria-label="Expand or collapse the log" tabindex="-1">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
      </div>
      <div id="transcript-body">
        <div id="transcript-empty">
          <svg class="empty-mark" viewBox="0 0 100 100" aria-hidden="true"><polygon fill="currentColor" points="45,62.1 45,100 55,100 55,62.1 81.8,88.9 88.9,81.8 62.1,55 100,55 100,45 62.1,45 88.9,18.2 81.8,11.1 55,37.9 55,0 45,0 45,37.9 18.2,11.1 11.1,18.2 37.9,45 0,45 0,55 37.9,55 11.1,81.8 18.2,88.9"/></svg>
          <div class="empty-title">Pick a running task</div>
          <div class="empty-hint">Select any task on the left to stream what its agent is saying, live.</div>
        </div>
        <div id="transcript-log"></div>
        <form id="comment-form">
          <input type="text" id="comment-input" placeholder="Post a message on this issue…" autocomplete="off" enterkeyhint="send" disabled />
          <button type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
      </div>
    </section>
  </main>
  <div id="sheet-backdrop"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
