<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multica Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Multica" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="agent-bar"></header>
  <div id="toolbar">
    <label class="switch">
      <input type="checkbox" id="show-all" />
      <span class="track"></span>
      <span>Show all open issues</span>
    </label>
    <span id="issue-count"></span>
  </div>
  <main>
    <section id="issue-tree"></section>
    <div id="divider"></div>
    <section id="transcript">
      <div id="transcript-header">
        <span id="transcript-title">Select an issue with an active agent to watch it work.</span>
        <label class="switch">
          <input type="checkbox" id="auto-scroll" checked />
          <span class="track"></span>
          <span>Auto-scroll</span>
        </label>
      </div>
      <div id="transcript-log"></div>
      <form id="comment-form">
        <input type="text" id="comment-input" placeholder="Post a message on this issue…" autocomplete="off" disabled />
        <button type="submit" disabled>Send</button>
      </form>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
